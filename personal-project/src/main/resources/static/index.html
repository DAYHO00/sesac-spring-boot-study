
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampKit | 캠핑 장비 위시리스트</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <h1>⛺ CampKit</h1>
    <p>나만의 캠핑 장비 위시리스트 & 예산 추천</p>
</header>

<main>

    <!-- 캠핑 장비 등록 -->
    <section class="card">
        <h2>🌲 캠핑 장비 등록</h2>

        <form id="registerForm" class="form-row">
            <input
                    type="text"
                    id="itemName"
                    placeholder="장비 이름 (예: 캠핑 랜턴)"
            >

            <input
                    type="number"
                    id="itemPrice"
                    placeholder="가격 (원)"
                    min="0"
                    step="1"
            >

            <button type="submit">장비 등록</button>
        </form>

        <div id="registerMessage" class="message"></div>
    </section>

    <!-- 전체 목록 -->
    <section class="card">
        <h2>🎒 나의 캠핑 위시리스트</h2>

        <div id="itemList">
            <div class="empty">
                아직 등록된 캠핑 장비가 없습니다.
            </div>
        </div>
    </section>

    <!-- 예산별 장비 추천 -->
    <section class="card">
        <h2>💰 예산별 장비 추천</h2>

        <form id="recommendForm" class="form-row">
            <input
                    type="number"
                    id="budget"
                    placeholder="예산을 입력하세요 (원)"
                    min="0"
                    step="1"
            >

            <button type="submit">추천받기</button>
        </form>

        <div id="recommendList" class="recommend-list">
            <div class="empty">
                예산을 입력하면 장비를 추천해 드립니다.
            </div>
        </div>
    </section>

</main>

<footer>
    CampKit © 2026 | Spring Boot & Java
</footer>

<script src="/js/app.js"></script>

</body>
</html>
